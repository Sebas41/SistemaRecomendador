[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sisreco"
version = "0.1.0"
description = "Recomendador multilingüe de artículos científicos para proyectos de grado y tesis"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<4",
  "pyarrow>=17,<25",
  "scikit-learn>=1.5,<2",
  "sentence-transformers>=5.1,<6",
  "streamlit>=1.40,<2",
  "requests>=2.32,<3",
  "tqdm>=4.66,<5",
  "langdetect>=1.0.9,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "jupyterlab>=4.2,<5", "matplotlib>=3.9,<4", "seaborn>=0.13,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
